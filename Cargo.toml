[package]
name = "natnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "Sans-io OptiTrack NatNet protocol core: checked parse/serialize, version-aware SERVERINFO, MODELDEF and FrameOfData, with optional std-UDP clients."
repository = "https://github.com/AndrejOrsula/natnet"
readme = "README.md"
keywords = ["natnet", "optitrack", "motive", "mocap", "sans-io"]
categories = ["parser-implementations", "network-programming"]
include = [
    "/src",
    "/examples",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[features]
default = ["net"]
net = []
imagery = []
serde = ["dep:serde"]
nalgebra = ["dep:nalgebra"]

[[example]]
name = "probe"
required-features = ["net"]
test = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
nalgebra = { version = "0.35", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
serde_test = "1.0.177"

[target.'cfg(any(unix, windows))'.dev-dependencies]
if-addrs = { version = "0.15", features = ["link-local"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
redundant_closure_for_method_calls = "allow"

# Production panic, placeholder, and UTF-8 slicing policy.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
string_slice = "warn"
